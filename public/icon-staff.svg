<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0c1a2c"/>
      <stop offset="60%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="180" fill="url(#glow)"/>
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Cocktail glass icon above the S to denote SERVICE -->
  <g transform="translate(256 110)" filter="url(#drop)">
    <path d="M -36 -30 L 36 -30 L 0 16 Z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <line x1="0" y1="16" x2="0" y2="36" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-18" y1="36" x2="18" y2="36" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-12" cy="-22" r="3" fill="url(#accent)"/>
  </g>

  <g filter="url(#drop)">
    <text x="256" y="350"
          font-family="'Playfair Display', 'Didot', 'Times New Roman', serif"
          font-size="320"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="url(#accent)">S</text>
  </g>

  <circle cx="110" cy="110" r="5" fill="url(#accent)" opacity="0.85"/>
  <circle cx="402" cy="402" r="5" fill="url(#accent)" opacity="0.85"/>

  <text x="256" y="448"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="14"
        text-anchor="middle"
        fill="#bae6fd"
        opacity="0.85">STAFF</text>
  <text x="256" y="478"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        font-weight="500"
        letter-spacing="6"
        text-anchor="middle"
        fill="#0ea5e9"
        opacity="0.55">SALLY'S BAR</text>
</svg>
