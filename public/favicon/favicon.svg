<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="60%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background (rounded-square, maskable-safe) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft gold glow behind the monogram -->
  <circle cx="256" cy="232" r="180" fill="url(#glow)"/>

  <!-- Thin gold border frame (inside the maskable safe area ~ 82%) -->
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none"
        stroke="url(#gold)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- SALLY'S monogram 'S' — serif-styled, gold gradient -->
  <g filter="url(#drop)">
    <text x="256" y="330"
          font-family="'Playfair Display', 'Didot', 'Times New Roman', serif"
          font-size="360"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="url(#gold)">S</text>
  </g>

  <!-- Small amber accent dots (top-left / bottom-right, like a cocktail garnish) -->
  <circle cx="110" cy="110" r="5" fill="url(#gold)" opacity="0.85"/>
  <circle cx="402" cy="402" r="5" fill="url(#gold)" opacity="0.85"/>

  <!-- Footer wordmark -->
  <text x="256" y="432"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="14"
        text-anchor="middle"
        fill="#fef3c7"
        opacity="0.85">SALLY'S</text>
  <text x="256" y="464"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="16"
        font-weight="500"
        letter-spacing="6"
        text-anchor="middle"
        fill="#fbbf24"
        opacity="0.55">BAR · KEFALONIA</text>
</svg>
