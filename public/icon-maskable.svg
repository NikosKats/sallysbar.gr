<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1220"/>
      <stop offset="60%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- FULL-BLEED background — Android/iOS will mask to their preferred shape -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Soft glow (inside safe circle ~ 80%) -->
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- S monogram — scaled smaller so ALL of it stays inside the safe-area circle -->
  <text x="256" y="340"
        font-family="'Playfair Display', 'Didot', 'Times New Roman', serif"
        font-size="280"
        font-weight="900"
        font-style="italic"
        text-anchor="middle"
        fill="url(#gold)">S</text>
</svg>
